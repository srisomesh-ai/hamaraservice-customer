name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: stable

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Create asset directories
        run: mkdir -p assets/icons assets/animations assets/fonts
        
      - name: Create local.properties
        run: |
          FLUTTER_PATH=$(dirname $(which flutter))
          echo "flutter.sdk=${FLUTTER_PATH%/bin}" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      # android/settings.gradle and android/gradle/wrapper/gradle-wrapper.properties
      # (Gradle 7.6.3, matching AGP 7.3.0) come from the repo. Flutter injects the
      # gradlew scripts itself and keeps the repo's wrapper properties.

      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            # storeFile is resolved relative to android/app (see android/app/build.gradle)
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Release keystore configured."
          else
            echo "::warning::Signing secrets not set - the release APK will be signed with the debug key."
          fi

      - name: Get dependencies
        run: flutter pub get
        
      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hamaraservice-customer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
