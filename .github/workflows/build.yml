name: Build APK / AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: stable

      - name: Create google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Create asset directories
        run: mkdir -p assets/icons assets/animations assets/fonts

      - name: Create local.properties
        run: |
          FLUTTER_PATH=$(dirname $(which flutter))
          echo "flutter.sdk=${FLUTTER_PATH%/bin}" > android/local.properties
          echo "sdk.dir=$ANDROID_HOME" >> android/local.properties

      - name: Create settings.gradle
        run: |
          cat > android/settings.gradle << 'SETTINGSEOF'
          include ':app'
          def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
          def properties = new Properties()
          assert localPropertiesFile.exists()
          localPropertiesFile.withReader("UTF-8") { reader -> properties.load(reader) }
          def flutterSdkPath = properties.getProperty("flutter.sdk")
          assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
          apply from: "$flutterSdkPath/packages/flutter_tools/gradle/app_plugin_loader.gradle"
          SETTINGSEOF

      - name: Create gradle wrapper
        run: |
          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'GRADLEEOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-all.zip
          GRADLEEOF

      - name: Release signing (keystore from secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            # Only the keystore and its password are required; alias defaults to
            # "upload" and the key password to the keystore password (PKCS12).
            KEY_ALIAS="${KEY_ALIAS:-upload}"; KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Release keystore configured."
          else
            echo "::warning::Signing secrets not set - release builds use the DEBUG key and cannot be uploaded to Play."
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Generate app icons
        run: flutter pub run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --build-number=${{ github.run_number }}

      - name: Build App Bundle (AAB)
        run: flutter build appbundle --release --no-tree-shake-icons --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hamaraservice-customer-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: hamaraservice-customer-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

  # Launches the release APK on an emulator and prints the crash log, so a
  # startup crash shows up in the run logs.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hamaraservice-customer-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Write launch script
        run: |
          cat > launch.sh << 'LAUNCHEOF'
          set -x
          adb install -r app-release.apk
          adb logcat -c
          adb shell monkey -p com.hamaraservice.customer -c android.intent.category.LAUNCHER 1
          sleep 30
          adb shell pidof com.hamaraservice.customer && echo "APP_ALIVE" || echo "APP_DEAD"
          adb shell dumpsys activity activities | grep -i "mResumedActivity\|topResumedActivity" || true
          echo "===== CRASH LOG ====="
          adb logcat -d -b crash || true
          echo "===== APP LOG ====="
          adb logcat -d | grep -iE "AndroidRuntime|FATAL|flutter|hamaraservice|DEBUG   :|libc    :|Firebase" | tail -300 || true
          adb shell pidof com.hamaraservice.customer > /dev/null || { echo "::error::App crashed on launch"; exit 1; }
          LAUNCHEOF
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash launch.sh
