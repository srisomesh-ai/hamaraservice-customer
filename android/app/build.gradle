plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Release signing: android/key.properties (written by CI from secrets, or
// created locally — never committed). Expected keys:
//   storeFile=upload-keystore.jks   (relative to android/app)
//   storePassword=...  keyAlias=...  keyPassword=...
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseKey = keystorePropertiesFile.exists()
if (hasReleaseKey) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
} else {
    logger.warn("key.properties not found — release build will be signed with the DEBUG key (local testing only, not uploadable to Play).")
}

android {
    namespace "com.hamaraservice.customer"
    compileSdk 36
    ndkVersion flutter.ndkVersion
    compileOptions {
        // required by flutter_local_notifications
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    sourceSets { main.java.srcDirs += 'src/main/kotlin' }
    defaultConfig {
        applicationId "com.hamaraservice.customer"
        minSdkVersion 24
        targetSdkVersion 36
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }
    signingConfigs {
        release {
            if (hasReleaseKey) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            // Debug-key fallback exists only so local `flutter run --release` works.
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}
flutter { source '../..' }
dependencies {
    implementation platform('com.google.firebase:firebase-bom:31.5.0')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}
