name: hamaraservice_customer
description: HamaraService - Book Home Services
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.13.1
  firebase_auth: ^4.6.3
  firebase_database: ^10.2.4
  firebase_messaging: ^14.9.4
  shared_preferences: ^2.1.2
  http: ^1.1.0
  pinput: ^3.0.1
  google_sign_in: ^6.1.6
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  url_launcher: ^6.3.1
  razorpay_flutter: ^1.3.7
  audioplayers: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - slogo-png.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "slogo-png.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "slogo-png.png"
